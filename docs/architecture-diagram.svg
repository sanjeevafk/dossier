  <rect x="420" y="70" width="34" height="10" rx="2" fill="transparent" stroke="rgba(148,163,184,0.3)" stroke-width="0.8"/>
  <text x="437" y="77.5" fill="#94a3b8" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ORACLE</text>
  <text x="502" y="87" fill="#e8e4dc" font-size="10.5" font-weight="600" text-anchor="middle">Polymarket Live</text>
  <text x="502" y="99" fill="#64748b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Gamma API Odds</text>

