  <rect x="420" y="142" width="34" height="10" rx="2" fill="transparent" stroke="rgba(148,163,184,0.3)" stroke-width="0.8"/>
  <text x="437" y="149.5" fill="#94a3b8" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SOCIAL</text>
  <text x="502" y="159" fill="#e8e4dc" font-size="10.5" font-weight="600" text-anchor="middle">Agent Reach</text>
  <text x="502" y="171" fill="#64748b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Reddit / X / HN Recon</text>

  <!-- Tool 3: MCP Client Manager -->
  <rect x="412" y="208" width="168" height="48" rx="6" fill="#0e1015" stroke="#222634" stroke-width="1"/>
  <rect x="420" y="214" width="26" height="10" rx="2" fill="transparent" stroke="rgba(148,163,184,0.3)" stroke-width="0.8"/>
  <text x="433" y="221.5" fill="#94a3b8" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">MCP</text>
  <text x="502" y="231" fill="#e8e4dc" font-size="10.5" font-weight="600" text-anchor="middle">Native MCP Client</text>
  <text x="502" y="243" fill="#64748b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Github / Filesystem</text>

  <!-- SWARM CLUSTER: 6 Specialized Subagents -->
  <g transform="translate(636, 92)">
    <!-- Swarm Header -->
    <rect x="0" y="0" width="268" height="184" rx="6" fill="#0b0d13" stroke="#222634" stroke-width="1"/>
    
    <!-- Subagent 1: Analyst -->
    <rect x="8" y="8" width="122" height="38" rx="4" fill="#12151e" stroke="#262b3a"/>
    <text x="14" y="22" fill="#e8e4dc" font-size="9" font-weight="600">01 Market Analyst</text>
    <text x="14" y="34" fill="#64748b" font-size="7" font-family="'IBM Plex Mono', monospace">TAM / Comps</text>

    <!-- Subagent 2: Customer -->
    <rect x="138" y="8" width="122" height="38" rx="4" fill="#12151e" stroke="#262b3a"/>
    <text x="144" y="22" fill="#e8e4dc" font-size="9" font-weight="600">02 Customer Advocate</text>
    <text x="144" y="34" fill="#64748b" font-size="7" font-family="'IBM Plex Mono', monospace">WTP / Habit Inertia</text>

    <!-- Subagent 3: Architect -->
    <rect x="8" y="52" width="122" height="38" rx="4" fill="#12151e" stroke="#262b3a"/>
    <text x="14" y="66" fill="#e8e4dc" font-size="9" font-weight="600">03 Tech Architect</text>
    <text x="14" y="78" fill="#64748b" font-size="7" font-family="'IBM Plex Mono', monospace">Compute / Sandbox</text>

    <!-- Subagent 4: Investor -->
    <rect x="138" y="52" width="122" height="38" rx="4" fill="#12151e" stroke="#262b3a"/>
    <text x="144" y="66" fill="#e8e4dc" font-size="9" font-weight="600">04 Investor</text>
    <text x="144" y="78" fill="#64748b" font-size="7" font-family="'IBM Plex Mono', monospace">Moat / Margins</text>

    <!-- Subagent 5: Red Team (FOCAL ADVERSARY - CRIMSON) -->
    <rect x="8" y="96" width="122" height="42" rx="4" fill="#180e10" stroke="#ef4444" stroke-width="1.2"/>
    <text x="14" y="110" fill="#ef4444" font-size="9" font-weight="700">05 Red Team (Chief)</text>
    <text x="14" y="123" fill="#fca5a5" font-size="7" font-family="'IBM Plex Mono', monospace">FATAL FLAWS &amp; CHURN</text>

    <!-- Subagent 6: Domain Expert -->
    <rect x="138" y="96" width="122" height="42" rx="4" fill="#12151e" stroke="#262b3a"/>
    <text x="144" y="110" fill="#e8e4dc" font-size="9" font-weight="600">06 Domain Expert</text>
    <text x="144" y="123" fill="#64748b" font-size="7" font-family="'IBM Plex Mono', monospace">Vertical Regulations</text>

    <!-- OrcaRouter Badge -->
    <text x="134" y="162" fill="#f59e0b" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ORCAROUTER CONCURRENT INFERENCE</text>
  </g>

  <!-- Node: Debate & Contradiction Layer -->
  <rect x="640" y="336" width="260" height="64" rx="6" fill="#141113" stroke="#ef4444" stroke-width="1"/>
  <rect x="648" y="342" width="68" height="10" rx="2" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="0.8"/>
  <text x="682" y="349.5" fill="#ef4444" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CONTRADICTION</text>
  <text x="770" y="366" fill="#e8e4dc" font-size="11" font-weight="600" text-anchor="middle">Adversarial Cross-Examination</text>
  <text x="770" y="382" fill="#94a3b8" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Surfaces Unresolved Hypothesis Clashes</text>

  <!-- Node: Python3 Subprocess Sandbox -->
  <rect x="360" y="336" width="212" height="64" rx="6" fill="#0e1315" stroke="#10b981" stroke-width="1"/>
  <rect x="368" y="342" width="48" height="10" rx="2" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8"/>
  <text x="392" y="349.5" fill="#10b981" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SANDBOX</text>
  <text x="466" y="366" fill="#e8e4dc" font-size="11" font-weight="600" text-anchor="middle">TrueForge Python3 Runner</text>
  <text x="466" y="382" fill="#10b981" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">LTV/CAC, Payback &amp; Token Stress</text>

  <!-- Node: Synthesizer & Dual-Key Approval Gates -->
  <rect x="88" y="336" width="204" height="64" rx="6" fill="#15120d" stroke="#f59e0b" stroke-width="1"/>
  <rect x="96" y="342" width="70" height="10" rx="2" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="131" y="349.5" fill="#f59e0b" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SYNTHESIS &amp; GATE</text>
  <text x="190" y="366" fill="#e8e4dc" font-size="11" font-weight="600" text-anchor="middle">Synthesizer &amp; Dual-Key Gate</text>
  <text x="190" y="382" fill="#f59e0b" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Resilience Score &amp; Action Halt</text>

  <!-- Node: Outbound Execution Action -->
  <rect x="88" y="442" width="204" height="52" rx="6" fill="#0e1015" stroke="#282d3c" stroke-width="1"/>
  <rect x="96" y="448" width="56" height="10" rx="2" fill="transparent" stroke="rgba(148,163,184,0.3)" stroke-width="0.8"/>
  <text x="124" y="455.5" fill="#94a3b8" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">AUTHORIZED</text>
  <text x="190" y="470" fill="#e8e4dc" font-size="10.5" font-weight="600" text-anchor="middle">External Action Execution</text>
  <text x="190" y="483" fill="#64748b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Smoke-Test Landing / Outreach</text>


  <!-- ==================== HORIZONTAL LEGEND STRIP ==================== -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="#1e222e" stroke-width="1"/>
  
  <text x="40" y="562" fill="#64748b" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.12em">LEGEND &amp; SPEC</text>

  <!-- Legend 1: Core Flow -->
  <line x1="160" y1="558" x2="184" y2="558" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="192" y="561" fill="#94a3b8" font-size="8" font-family="'IBM Plex Mono', monospace">Standard Orchestration</text>

  <!-- Legend 2: Adversarial / Red Team -->
  <line x1="370" y1="558" x2="394" y2="558" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrow-crimson)"/>
  <text x="402" y="561" fill="#ef4444" font-size="8" font-family="'IBM Plex Mono', monospace">Adversarial Red Team Clash</text>

  <!-- Legend 3: Sandboxed Simulation -->
  <line x1="600" y1="558" x2="624" y2="558" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <text x="632" y="561" fill="#10b981" font-size="8" font-family="'IBM Plex Mono', monospace">Python Subprocess Proof</text>

  <!-- Legend 4: Human Gate -->
  <line x1="790" y1="558" x2="814" y2="558" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-amber)"/>
  <text x="822" y="561" fill="#f59e0b" font-size="8" font-family="'IBM Plex Mono', monospace">Human Approval Gate</text>

</svg>
