<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#07080a; font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-crimson" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>

    <!-- Subtle Ground Texture -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#07080a"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)"/>

  <!-- Section Boundary Box: TrueForge Swarm Perimeter -->
  <rect x="620" y="60" width="300" height="236" rx="8" fill="rgba(245, 158, 11, 0.02)" stroke="rgba(245, 158, 11, 0.25)" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="632" y="78" fill="#f59e0b" font-size="9" font-family="'IBM Plex Mono', monospace" font-weight="600" letter-spacing="0.12em">TRUEFORGE ADVERSARIAL SWARM</text>

  <!-- ==================== CONNECTORS (DRAWN FIRST FOR Z-INDEX) ==================== -->
  
  <!-- 1. User -> Intake -->
  <path d="M 160 160 L 212 160" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 2. Intake -> Polymarket (Orthogonal Arc) -->
  <path d="M 332 140 L 372 140 A 8 8 0 0 0 380 132 L 380 96 A 8 8 0 0 1 388 88 L 412 88" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 3. Intake -> Agent Reach (Straight) -->
  <path d="M 332 160 L 412 160" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 4. Intake -> MCP Client (Orthogonal Arc) -->
  <path d="M 332 180 L 372 180 A 8 8 0 0 1 380 188 L 380 224 A 8 8 0 0 0 388 232 L 412 232" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 5. Tool Cluster -> Swarm Engine -->
  <path d="M 580 88 L 602 88 A 8 8 0 0 1 610 96 L 610 140 A 8 8 0 0 0 618 148 L 632 148" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 580 160 L 632 160" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 580 232 L 602 232 A 8 8 0 0 0 610 224 L 610 180 A 8 8 0 0 1 618 172 L 632 172" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6. Swarm -> Debate Layer (Vertical) -->
  <path d="M 770 276 L 770 332" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- 7. Debate Layer -> Sandbox (Left Orthogonal) -->
  <path d="M 640 368 L 572 368" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrow-crimson)"/>

  <!-- 8. Sandbox -> Synthesizer & Approval Gates -->
  <path d="M 360 368 L 292 368" fill="none" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

  <!-- 9. Approval Gates -> Outbound Execution -->
  <path d="M 190 400 L 190 442" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-amber)"/>

  <!-- ==================== CONNECTOR LABELS (WITH MASKING GAP) ==================== -->
  
  <rect x="166" y="146" width="36" height="12" rx="2" fill="#07080a"/>
  <text x="184" y="155" fill="#94a3b8" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">INGEST</text>

  <rect x="732" y="298" width="76" height="12" rx="2" fill="#07080a"/>
  <text x="770" y="307" fill="#f59e0b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CROSS-EXAMINE</text>

  <rect x="582" y="354" width="46" height="12" rx="2" fill="#07080a"/>
  <text x="605" y="363" fill="#ef4444" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">STRESS-TEST</text>

  <rect x="302" y="354" width="48" height="12" rx="2" fill="#07080a"/>
  <text x="326" y="363" fill="#10b981" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SYNTHESIZE</text>

  <rect x="148" y="414" width="84" height="12" rx="2" fill="#07080a"/>
  <text x="190" y="423" fill="#f59e0b" font-size="7.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">OPERATOR APPROVAL</text>


  <!-- ==================== NODES & COMPONENT BOXES ==================== -->

  <!-- Node 1: User / Founder Input -->
  <rect x="40" y="132" width="120" height="56" rx="6" fill="#0e1015" stroke="#222634" stroke-width="1"/>
  <rect x="48" y="138" width="36" height="10" rx="2" fill="transparent" stroke="rgba(148,163,184,0.3)" stroke-width="0.8"/>
  <text x="66" y="145.5" fill="#94a3b8" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SOURCE</text>
  <text x="100" y="162" fill="#e8e4dc" font-size="11" font-weight="600" text-anchor="middle">Founder / User</text>
  <text x="100" y="176" fill="#64748b" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Idea / Repo Path</text>

  <!-- Node 2: Dossier Intake Engine -->
  <rect x="212" y="132" width="120" height="56" rx="6" fill="#11131a" stroke="#f59e0b" stroke-width="1"/>
  <rect x="220" y="138" width="32" height="10" rx="2" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="236" y="145.5" fill="#f59e0b" font-size="6.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">INTAKE</text>
  <text x="272" y="162" fill="#e8e4dc" font-size="11" font-weight="600" text-anchor="middle">Intake Engine</text>
