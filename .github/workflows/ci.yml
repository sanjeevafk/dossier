name: Dossier CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Test & Decision Model Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Typecheck & Compile TypeScript
        run: pnpm build

      - name: Julia-1 Fast Decision Model Gate (<35ms, 100% Fatal Recall)
        run: pnpm test:decision

      - name: Run Full Multi-Agent & Verification Test Suite
        run: pnpm test
